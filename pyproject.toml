[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "industrial-diagnostic-agent"
version = "0.1.0"
description = "A learning project for a read-only industrial diagnostic agent."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain==1.3.16",
    "langchain-core==1.6.0",
    "langchain-deepseek==1.1.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "langsmith==0.11.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "unit: deterministic tests that do not require services or credentials",
    "live: explicit tests that require an available external model or service",
]
